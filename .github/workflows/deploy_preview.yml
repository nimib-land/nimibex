# .github/workflows/deploy_preview.yml
name: Deploy PR previews

on:
  workflow_run:
    workflows: [netlify_build_docs]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: write
  pages: write
  statuses: write
  id-token: write

jobs:
  get-pr-number:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.get-pr.outputs.pr-number }}
    steps:
      - name: Get PR number from workflow run
        id: get-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh api repos/${{ github.repository }}/pulls \
            --jq ".[] | select(.head.sha == \"${{ github.event.workflow_run.head_sha }}\") | .number" \
            | head -1)
          echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT

  reupload-artifact:
    needs: get-pr-number
    if: ${{ needs.get-pr-number.outputs.pr-number != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from triggering run    # 👈 key step: cross-run download
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}  # 👈 explicitly target the build run
          github-token: ${{ github.token }}
          path: __artifact

      - name: Re-upload artifact into THIS run         # 👈 so the reusable workflow can find it
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.workflow_run.head_sha }}
          path: __artifact/

  deploy-preview:
    needs: [get-pr-number, reupload-artifact]
    if: ${{ needs.get-pr-number.outputs.pr-number != '' }}
    uses: PazerOP/pr-preview-action/.github/workflows/pr-preview-action-ghp.yml@4499064eaedb2694468204bbbc4fb04bdcd3284f
    with:
      artifact-name: build-${{ github.event.workflow_run.head_sha }}
      action: deploy                                        # skip auto-detection
      pr-number: ${{ needs.get-pr-number.outputs.pr-number }}  # pass PR number explicitly
    secrets: inherit
