name: Deploy PR previews

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read      # needed for artifact-name
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: apt install
        run: sudo apt install -y libpcre3 libblas-dev liblapack-dev
      - uses: actions/checkout@v2
      - name: install nim
        id: install_nim
        uses: iffy/install-nim@v5
      - name: install library dependencies
        run: nimble sync -y && nimble setup
      - name: build docs
        run: nimble buildBook
      - name: build autogenerated docs
        run: nimble docs
      - run: echo Commit hash = ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.pull_request.head.sha }}
          path: docs/
          retention-days: 1
          if-no-files-found: error

  deploy-preview:
    needs: build
    uses: PazerOP/pr-preview-action/.github/workflows/pr-preview-action-ghp.yml@4499064eaedb2694468204bbbc4fb04bdcd3284f
    with:
      artifact-name: build-${{ github.event.pull_request.head.sha }}
    secrets: inherit