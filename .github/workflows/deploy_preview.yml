# .github/workflows/deploy_preview.yml
name: Deploy PR previews

on:
  workflow_run:
    workflows: [netlify_build_docs]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: write
  pages: write
  statuses: write
  id-token: write

jobs:
  reupload-artifact:
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from triggering run
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: __artifact

      - name: Re-upload artifact into THIS run
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.workflow_run.head_sha }}
          path: __artifact/

  deploy-preview:
    needs: [reupload-artifact]
    if: ${{ needs.get-pr-number.outputs.pr-number != '' }}
    uses: PazerOP/pr-preview-action/.github/workflows/pr-preview-action-ghp.yml@4499064eaedb2694468204bbbc4fb04bdcd3284f
    with:
      artifact-name: build-${{ github.event.workflow_run.head_sha }}
      action: deploy                                        # skip auto-detection
      pr-number: ${{ needs.get-pr-number.outputs.pr-number }}  # pass PR number explicitly
    secrets: inherit
