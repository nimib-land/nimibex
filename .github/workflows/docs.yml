name: Generate nimibex docs

on:
  push:
    branches:
      - main


jobs:
  gen:
    name: Generate and deploy docs
    runs-on: ubuntu-latest  

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: apt install
        run: sudo apt install -y libpcre3 libblas-dev liblapack-dev
      - uses: iffy/install-nim@v5
      - name: Generate
        run: |
          set -e
          nimble sync -y
          nimble setup
          nimble docs
          nimble buildBook
      - name: Upload Pages artifact       # ← packages ./docs as an artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy to GitHub Pages      # ← creates an actual deployment
        id: deployment
        uses: actions/deploy-pages@v4
