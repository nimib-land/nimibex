name: Generate nimibex docs

on:
  push:
    branches:
      - main

jobs:
  gen:
    name: Generate and deploy docs
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: apt install
        run: sudo apt install -y libpcre3 libblas-dev liblapack-dev
      - uses: iffy/install-nim@v5
      - name: Generate
        run: |
          set -e
          nimble sync -y
          nimble setup
          nimble docs
          nimble buildBook
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          force_orphan: false
